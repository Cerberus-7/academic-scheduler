services:
  # Python Web Service hosting both API & compiled Frontend
  - type: web
    name: academic-resource-scheduler
    runtime: python
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    disk:
      name: scheduler-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.0
      - key: DATA_DIR
        value: /data
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: SECRET_KEY
        generateValue: true
